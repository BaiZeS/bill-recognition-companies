<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>票据识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 class="app-title">票据识别</h1>
  <div class="topbar-actions">
    <label class="check"><input id="dewmCheck" type="checkbox" checked>去水印</label>
    <label class="check"><input id="desealCheck" type="checkbox" checked>去红章</label>
    <button id="uploadBtn" class="btn btn-primary">上传文件</button>
    <input id="fileInput" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" hidden>
    <input id="rulesFileInput" type="file" accept=".xlsx,.json" hidden>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">任务列表</div>
    <label class="select-all"><input id="selectAll" type="checkbox"> 全选</label>
    <ul id="taskList" class="task-list"></ul>
    <div id="taskEmpty" class="side-empty" hidden>暂无任务，点击右上角上传</div>
    <div id="batchPanel" class="batch-panel" hidden>
      <div class="batch-head">
        <span>已选 <span id="batchCount">0</span> 个</span>
        <button id="batchClear" class="btn btn-ghost">取消选择</button>
      </div>
      <button id="batchExtractHead" class="batch-acc-head">批量抽取</button>
      <div id="batchExtractBody" class="batch-body" hidden>
        <div class="batch-row">
          <button id="batchTplBtn" class="btn">模板下载</button>
          <button id="batchRulesBtn" class="btn">上传规则</button>
          <input id="batchRulesInput" type="file" accept=".xlsx,.json" hidden>
        </div>
        <button id="batchExtractBtn" class="btn btn-primary batch-confirm">确认抽取</button>
      </div>
      <button id="batchExportHead" class="batch-acc-head">批量导出</button>
      <div id="batchExportBody" class="batch-body" hidden>
        <div class="batch-row">
          <label class="check"><input id="exportResultChk" type="checkbox" checked> 识别结果</label>
          <label class="check"><input id="exportExtractedChk" type="checkbox" checked> 抽取结果</label>
        </div>
        <button id="batchExportBtn" class="btn btn-primary batch-confirm">确认导出</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <section class="pane">
      <div class="pane-head">原文预览</div>
      <div id="previewBody" class="pane-body"></div>
    </section>

    <section class="pane">
      <div class="pane-head pane-head-tabs">
        <div class="tabs" id="viewTabs">
          <button class="tab active" data-view="restore">复原视图</button>
          <button class="tab" data-view="extract" disabled>规则抽取</button>
        </div>
      </div>
      <div id="restorePane" class="tab-pane">
        <div class="pane-toolbar" id="toolbar" hidden>
          <div class="toolbar-group">
            <label class="tool">
              <span class="tool-label">底图透明度</span>
              <input id="ghostRange" type="range" min="0" max="50" value="15">
            </label>
            <div class="tool-group">
              <button id="zoomOut" class="btn btn-ghost" title="缩小">−</button>
              <button id="zoomFit" class="btn btn-ghost">适应宽度</button>
              <button id="zoomIn" class="btn btn-ghost" title="放大">+</button>
            </div>
          </div>
          <div class="toolbar-group">
            <button id="saveBtn" class="btn btn-primary">保存修正</button>
            <button id="downloadBtn" class="btn">下载识别 JSON</button>
          </div>
        </div>
        <div id="formBody" class="pane-body"></div>
      </div>
      <div id="extractPane" class="tab-pane" hidden>
        <div class="pane-toolbar">
          <div class="tabs tabs-sub" id="extractTabs">
            <button class="tab active" data-tab="result">抽取结果</button>
            <button class="tab" data-tab="rules">规则模板</button>
          </div>
          <div class="toolbar-group">
            <button id="extractBtn" class="btn btn-primary">按照规则抽取</button>
            <button id="extractDownloadBtn" class="btn">下载抽取 JSON</button>
          </div>
        </div>
        <div id="extractBody" class="pane-body">
          <div id="rulesPanel" class="rules-panel" hidden></div>
          <div id="extractResult"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
